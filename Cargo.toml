[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/designcraft", "apps/designcraft-cli", "xtask"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/designcraft"

[workspace.dependencies]
# Shared reader and writer; publish the immutable revision before this consumer.
craft-pdf = { git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9", version = "=0.1.0", default-features = false }
# Separations, ink coverage and the ink manager; same revision as craft-pdf and the krilla patch.
craft-prepress = { git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9", version = "=0.1.0", features = ["flatten"] }
# Shared keyboard bindings: chords, overrides, conflicts, egui dispatch, the Keyboard Shortcuts dialog.
craft-keymap = { git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9", version = "=0.1.0", features = ["egui", "ui"] }
# internal
designcraft-geom = { path = "crates/geom" }
designcraft-color = { path = "crates/color" }
designcraft-doc = { path = "crates/doc" }
designcraft-fonts = { path = "crates/fonts" }
designcraft-compose = { path = "crates/compose" }
designcraft-images = { path = "crates/images" }
designcraft-render = { path = "crates/render" }
designcraft-pdf = { path = "crates/pdf" }
designcraft-idml = { path = "crates/idml" }
designcraft-epub = { path = "crates/epub" }
designcraft-pptx = { path = "crates/pptx" }
designcraft-textimport = { path = "crates/textimport" }
designcraft-format = { path = "crates/format" }
designcraft-tools = { path = "crates/tools" }
designcraft-engine = { path = "crates/engine" }
designcraft-ui-egui = { path = "crates/ui-egui" }
designcraft-mcp = { path = "crates/mcp" }
designcraft-testkit = { path = "crates/testkit" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-script = "0.5"
unicode-bidi-mirroring = "0.4"
unicode-segmentation = "1"
caseless = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
fancy-regex = "0.19.2"
tempfile = "3"
same-file = "1.0.6"

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
# CMYK TIFF samples for PDF export (`image` decodes them to RGB); the version `image` uses.
tiff = "0.11"
# SVG (same usvg as krilla-svg).
resvg = { version = "0.47", default-features = false, features = ["text"] }
krilla-svg = "=0.8.1"
# Boolean operations on Bézier paths (Pathfinder).
flo_curves = "0.8"
# QR codes (Object › Generate QR Code); MIT.
qrcodegen = "1.8"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
# INDD/INDT → IDML conversion for File › Open: storytold/indd-utils, tracking its main branch
# (MIT OR Apache-2.0, no dependencies, builds for wasm).
indd = { git = "https://github.com/storytold/indd-utils", branch = "main" }

# Which paths stored in documents may be followed (craft-libs).
craft-docpath = { version = "0.1.0", git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9" }
# Atomic file replacement for saves and exports (craft-libs).
craft-atomic = { version = "0.1.0", git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9" }
# File › Print through the system print spooler (craft-libs).
craft-print = { version = "0.1.0", git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9" }

# ICC colour management: working spaces, transforms, black point compensation (craft-libs).
craft-cms = { version = "0.1.0", git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9" }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9", features = ["serde"] }
craft-i18n = { version = "0.1.0", git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9" }
# Embeds the craft-fonts interface faces, cut to the catalogs' characters (craft-libs).
craft-fonts-build = { version = "0.1.0", git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9" }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# The suite's patched toolkit: bidi, IME and platform fixes on egui 0.37, and winit 0.30 with
# the IME fixes and opt-in cancelable macOS termination.
[patch.crates-io]
ecolor = { git = "https://github.com/aiongg/egui", rev = "f6dcd0addf3bb39f99ec9d628dcc9d424e41b914" }
eframe = { git = "https://github.com/aiongg/egui", rev = "f6dcd0addf3bb39f99ec9d628dcc9d424e41b914" }
egui = { git = "https://github.com/aiongg/egui", rev = "f6dcd0addf3bb39f99ec9d628dcc9d424e41b914" }
egui-wgpu = { git = "https://github.com/aiongg/egui", rev = "f6dcd0addf3bb39f99ec9d628dcc9d424e41b914" }
egui-winit = { git = "https://github.com/aiongg/egui", rev = "f6dcd0addf3bb39f99ec9d628dcc9d424e41b914" }
egui_glow = { git = "https://github.com/aiongg/egui", rev = "f6dcd0addf3bb39f99ec9d628dcc9d424e41b914" }
egui_kittest = { git = "https://github.com/aiongg/egui", rev = "f6dcd0addf3bb39f99ec9d628dcc9d424e41b914" }
emath = { git = "https://github.com/aiongg/egui", rev = "f6dcd0addf3bb39f99ec9d628dcc9d424e41b914" }
epaint = { git = "https://github.com/aiongg/egui", rev = "f6dcd0addf3bb39f99ec9d628dcc9d424e41b914" }
epaint_default_fonts = { git = "https://github.com/aiongg/egui", rev = "f6dcd0addf3bb39f99ec9d628dcc9d424e41b914" }
krilla = { git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9", version = "=0.8.2" }
winit = { git = "https://github.com/aiongg/winit", rev = "8b35388bd719e8cc86a95971ba0bc026c9a8f058" }
hayro = { git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9", version = "=0.7.1" }
hayro-interpret = { git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9", version = "=0.7.0" }
hayro-syntax = { git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9", version = "=0.7.2" }
hayro-jbig2 = { git = "https://github.com/aiongg/craft-libs", rev = "168be06594f1b4aa8896fdfc0ba143a43c06f0a9", version = "=0.3.0" }
